# Local development: Postgres only.
# The Next.js dev server runs on the host with `bun run dev`.
#
#   docker compose up -d
#   bun run db:migrate
#   bun run dev
name: challenge-dans

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dans}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dans_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-dans}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-dans} -d ${POSTGRES_DB:-dans}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
