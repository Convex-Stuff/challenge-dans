# Deployment: Postgres + the Next.js app, both containerised.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Requires POSTGRES_USER, POSTGRES_PASSWORD and POSTGRES_DB to be set in the
# environment (or a .env file next to this compose file). Migrations are
# applied by the one-shot `migrate` service before the app starts.
name: challenge-dans-prod

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  migrate:
    # Built locally with `--build`; on the server this is the image pushed by
    # the deploy workflow (set via APP_IMAGE/MIGRATE_IMAGE in .env).
    image: ${MIGRATE_IMAGE:-challenge-dans-migrate:latest}
    build:
      context: .
      target: migrator
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  app:
    image: ${APP_IMAGE:-challenge-dans-app:latest}
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
    # No published ports. The box's reverse proxy, a separate stack in the
    # convex-infra repo, reaches the app over `edge` as `dans-app` - a bare
    # `app` would be ambiguous on a network other stacks share.
    networks:
      default:
      edge:
        aliases:
          - dans-app
    depends_on:
      migrate:
        condition: service_completed_successfully
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

# Shared by every stack on this box and the reverse proxy in front of them.
# Declared external because no one project owns it; the deploy script creates
# it if it is missing.
networks:
  edge:
    external: true

volumes:
  postgres-data:
